on: push
name: CI
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Load repository
        uses: actions/checkout@master
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Run Build
        run: |
          npm ci
          npm run build
      - name: Run tests
        timeout-minutes: 5
        run: |
          npm run test-e2e:ci
          npm run test:ci
